<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross-stitch chart, 352 × 334</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#232046; --muted:#6b6880; --line:#d9dce5;
  --accent:#904551; --accent-ink:#ffffff; --hover:#f3f0f6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16151d; --panel:#211f2b; --ink:#ebe8f2; --muted:#a29fb3; --line:#363344;
    --accent:#c7737f; --accent-ink:#16151d; --hover:#2b2838; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16151d; --panel:#211f2b; --ink:#ebe8f2; --muted:#a29fb3; --line:#363344;
  --accent:#c7737f; --accent-ink:#16151d; --hover:#2b2838; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.zoom{display:inline-flex;align-items:center;gap:6px}
.zoom button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.zoom span{min-width:46px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
label.chk input{accent-color:var(--accent);width:16px;height:16px}
button:focus-visible,input:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;min-width:0}
#scroller{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y}
#spacer{pointer-events:none}
#cv{position:absolute;left:0;top:0;pointer-events:none}
.readout{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;display:flex;align-items:center;gap:8px;pointer-events:none;font-variant-numeric:tabular-nums}
.readout:empty{display:none}
.readout .sw{width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
aside{width:290px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.aside-head{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.aside-head h2{font-size:15px;margin:0 0 2px}
.aside-head p{margin:0;color:var(--muted);font-size:13px}
#legend{overflow:auto;flex:1;padding:6px}
.item{display:grid;grid-template-columns:26px 26px 1fr auto;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--hover)}
.item.on{border-color:var(--accent);background:var(--hover)}
.item canvas{width:26px;height:26px;display:block}
.item .sw{width:26px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.2)}
.item .num{font-weight:700}
.item .cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item.bg .num::after{content:" background";font-weight:400;color:var(--muted);font-size:12px}
.clear{margin:8px 14px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:7px;border-radius:8px;cursor:pointer}
.clear[hidden]{display:none}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:6px 11px;border-radius:8px;cursor:pointer}
.tbtn:hover{background:var(--hover)}
body.nocolors aside{display:none}
body.pseudo header{display:none}
#exitfs{position:absolute;right:12px;top:42px;z-index:5;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:7px 12px;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#exitfs[hidden]{display:none}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:auto;height:38vh;border-left:0;border-top:1px solid var(--line)}
  .tools{margin-left:0}
}
</style>
</head>
<body>
<header>
  <h1>Cross-stitch chart<small>352 × 334 stitches, 57 DMC colors</small></h1>
  <div class="tools">
    <div class="seg" role="group" aria-label="Chart view">
      <button data-mode="sym" aria-pressed="true">Symbols</button>
      <button data-mode="both" aria-pressed="false">Symbols + color</button>
      <button data-mode="col" aria-pressed="false">Color</button>
    </div>
    <div class="zoom">
      <button id="zout" aria-label="Zoom out">−</button><span id="zlabel">20 px</span><button id="zin" aria-label="Zoom in">+</button>
    </div>
    <div class="seg" role="group" aria-label="Grid size">
      <button data-grid="10" aria-pressed="true">10 × 10</button>
      <button data-grid="20" aria-pressed="false">20 × 20</button>
    </div>
    <label class="chk"><input type="checkbox" id="hidebg" checked> Hide background (3756)</label>
    <button class="tbtn" id="togglecolors" aria-pressed="false">Hide colors</button>
    <button class="tbtn" id="fs">Full screen</button>
  </div>
</header>
<main>
  <div class="stage">
    <div id="scroller"><div id="spacer"></div></div>
    <canvas id="cv"></canvas>
    <div class="readout" id="readout"></div>
    <button id="exitfs" hidden>Exit full screen</button>
  </div>
  <aside>
    <div class="aside-head"><h2>Colors</h2><p>Tap a color here or a stitch on the chart to focus on it. Tap again to show all.</p></div>
    <div id="legend" role="listbox" aria-label="Colors"></div>
    <button class="clear" id="clear" hidden>Show all colors</button>
  </aside>
</main>

  const showSym = mode!=='col' && S>=8;
  for(let r=r0;r<r1;r++){
    for(let c=c0;c<c1;c++){
      const v=idx[r*W+c]; if(hideBg && v===BG) continue;
      const p=pal[v], x=ox+c*S, y=oy+r*S, dim = sel>=0 && v!==sel;
      if(mode!=='sym'){ ctx.fillStyle = dim ? mix(p.rgb,0.82) : p.css; ctx.fillRect(x,y,S,S); }
      if(showSym){
        let col;
        if(mode==='sym') col = dim ? '#d6d4dc' : '#1d1b2c';
        else col = dim ? 'rgba(0,0,0,.12)' : (p.lum<110 ? '#ffffff' : '#1d1b2c');
        sym(ctx,p.k,x,y,S,col);
      }
      if(sel>=0 && !dim && mode==='sym'){ ctx.fillStyle='rgba(144,69,81,.16)'; ctx.fillRect(x,y,S,S); }
    }
  }
  // grid
  const gx0=ox+c0*S, gx1=ox+c1*S, gy0=oy+r0*S, gy1=oy+r1*S;
  if(S>=8){
    ctx.beginPath(); ctx.strokeStyle='rgba(40,40,70,.22)'; ctx.lineWidth=1;
    for(let c=c0;c<=c1;c++){ if(c%MAJ){const x=Math.round(ox+c*S)+.5; ctx.moveTo(x,gy0); ctx.lineTo(x,gy1);} }
    for(let r=r0;r<=r1;r++){ if(r%MAJ){const y=Math.round(oy+r*S)+.5; ctx.moveTo(gx0,y); ctx.lineTo(gx1,y);} }
    ctx.stroke();
  }
  ctx.beginPath(); ctx.strokeStyle='rgba(20,20,45,.85)'; ctx.lineWidth=S>=10?2:1.5;
  for(let c=Math.ceil(c0/MAJ)*MAJ;c<=c1;c+=MAJ){ const x=Math.round(ox+c*S); ctx.moveTo(x,gy0); ctx.lineTo(x,gy1); }
  for(let r=Math.ceil(r0/MAJ)*MAJ;r<=r1;r+=MAJ){ const y=Math.round(oy+r*S); ctx.moveTo(gx0,y); ctx.lineTo(gx1,y); }
  if(c1===W){const x=Math.round(ox+W*S);ctx.moveTo(x,gy0);ctx.lineTo(x,gy1);}

    {xs:[77,83,257,263],color:'#16a34a',w:2,dash:[5,4]}

    ctx.strokeStyle=g.color; ctx.lineWidth=g.w; ctx.setLineDash(g.dash);

    ctx.stroke();
  }
  ctx.restore();

  if(hover){ ctx.strokeStyle='#904551'; ctx.lineWidth=2; ctx.strokeRect(ox+hover.c*S+1,oy+hover.r*S+1,S-2,S-2); }
  // rulers
  ctx.fillStyle='#f4f4f7'; ctx.fillRect(0,0,vw,M); ctx.fillRect(0,0,M,vh);
  ctx.fillStyle='#3a3850'; ctx.font='700 11px "Atkinson Hyperlegible",Arial,sans-serif';
  const step = S>=8?MAJ:(S>=5?Math.max(20,MAJ):50);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let c=Math.ceil(c0/step)*step;c<=c1;c+=step){const x=ox+c*S; if(x>M-2) ctx.fillText(c,x,M/2);}
  ctx.textAlign='right';
  for(let r=Math.ceil(r0/step)*step;r<=r1;r+=step){const y=oy+r*S; if(y>M-2) ctx.fillText(r,M-4,y);}
  if(hover){ ctx.fillStyle='rgba(144,69,81,.25)'; ctx.fillRect(ox+hover.c*S,0,S,M); ctx.fillRect(0,oy+hover.r*S,M,S); }
  ctx.fillStyle='#f4f4f7'; ctx.fillRect(0,0,M,M);
  ctx.strokeStyle='#c9cad6'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,M+.5); ctx.lineTo(vw,M+.5); ctx.moveTo(M+.5,0); ctx.lineTo(M+.5,vh); ctx.stroke();
}
let raf=0; const req=()=>{ if(!raf) raf=requestAnimationFrame(()=>{raf=0;draw();}); };
scroller.addEventListener('scroll',req,{passive:true});
window.addEventListener('resize',size);

function setZoom(ns,fx,fy){
  const r=scroller.getBoundingClientRect();
  fx = fx ?? r.width/2; fy = fy ?? r.height/2;
  const gx=(scroller.scrollLeft+fx-M)/S, gy=(scroller.scrollTop+fy-M)/S;
  S=ns; document.getElementById('zlabel').textContent=S+' px';
  spacer.style.width=(M+W*S+20)+'px'; spacer.style.height=(M+H*S+20)+'px';
  scroller.scrollLeft=gx*S+M-fx; scroller.scrollTop=gy*S+M-fy; draw();
}
function zstep(dir,fx,fy){ let i=ZS.indexOf(S); i=Math.max(0,Math.min(ZS.length-1,i+dir)); if(ZS[i]!==S) setZoom(ZS[i],fx,fy); }
document.getElementById('zin').onclick=()=>zstep(1);
document.getElementById('zout').onclick=()=>zstep(-1);
scroller.addEventListener('wheel',e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); const r=scroller.getBoundingClientRect(); zstep(e.deltaY<0?1:-1,e.clientX-r.left,e.clientY-r.top);} },{passive:false});

document.querySelectorAll('.seg button[data-mode]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; document.querySelectorAll('.seg button[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw();
});
document.querySelectorAll('.seg button[data-grid]').forEach(b=>b.onclick=()=>{
  MAJ=+b.dataset.grid; document.querySelectorAll('.seg button[data-grid]').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw();
});
document.getElementById('hidebg').onchange=e=>{hideBg=e.target.checked;draw();};

function cellAt(e){
  const r=scroller.getBoundingClientRect();
  const c=Math.floor((e.clientX-r.left+scroller.scrollLeft-M)/S), rr=Math.floor((e.clientY-r.top+scroller.scrollTop-M)/S);
  return (c>=0&&c<W&&rr>=0&&rr<H)?{r:rr,c}:null;
}
function showReadout(h){
  if(!h){readout.innerHTML='';return;}
  const p=pal[idx[h.r*W+h.c]];
  readout.innerHTML=`<span class="sw" style="background:${p.css}"></span>Row ${h.r+1}, column ${h.c+1}: DMC ${p.k}`;
}
scroller.addEventListener('mousemove',e=>{ hover=cellAt(e); showReadout(hover); req(); });
scroller.addEventListener('mouseleave',()=>{ hover=null; showReadout(null); req(); });
scroller.addEventListener('click',e=>{
  hover=cellAt(e); showReadout(hover);
  if(!hover){ req(); return; }
  const v=idx[hover.r*W+hover.c];
  if(hideBg && v===BG){ if(sel>=0) selectColor(sel); else req(); return; }
  selectColor(v,true);
});

// ---------- legend ----------
const legend=document.getElementById('legend'), clearBtn=document.getElementById('clear');
const items=[];
function selectColor(i,fromChart){
  sel = sel===i ? -1 : i;
  items.forEach((x,j)=>{x.classList.toggle('on',j===sel);x.setAttribute('aria-selected',j===sel);});
  clearBtn.hidden = sel<0;
  if(sel===BG && hideBg){ hideBg=false; document.getElementById('hidebg').checked=false; }
  if(fromChart && sel>=0) items[sel].scrollIntoView({block:'nearest'});
  draw();
}
pal.forEach((p,i)=>{
  const el=document.createElement('div'); el.className='item'+(i===BG?' bg':''); el.tabIndex=0; el.setAttribute('role','option');
  const c=document.createElement('canvas'); const d=window.devicePixelRatio||1; c.width=26*d; c.height=26*d;
  const g=c.getContext('2d'); g.scale(d,d); g.fillStyle='#fff'; g.fillRect(0,0,26,26); sym(g,p.k,0,0,26,'#1d1b2c');
  g.strokeStyle='#c9cad6'; g.strokeRect(.5,.5,25,25);
  el.append(c);
  const sw=document.createElement('span'); sw.className='sw'; sw.style.background=p.css; el.append(sw);
  const n=document.createElement('span'); n.className='num'; n.textContent=p.k; el.append(n);
  const ct=document.createElement('span'); ct.className='cnt'; ct.textContent=counts[i].toLocaleString('en-US'); el.append(ct);
  const pick=()=>selectColor(i);
  el.onclick=pick; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();} };
  legend.append(el); items.push(el);
});
clearBtn.onclick=()=>{ sel=-1; items.forEach(x=>{x.classList.remove('on');x.setAttribute('aria-selected',false);}); clearBtn.hidden=true; draw(); };

// ---------- hide colors & full screen ----------
const colorsBtn=document.getElementById('togglecolors'), fsBtn=document.getElementById('fs'), exitBtn=document.getElementById('exitfs');
colorsBtn.onclick=()=>{
  const off=document.body.classList.toggle('nocolors');
  colorsBtn.textContent = off ? 'Show colors' : 'Hide colors';
  colorsBtn.setAttribute('aria-pressed', off);
  size();
};
const root=document.documentElement;
const canNative = !!(root.requestFullscreen || root.webkitRequestFullscreen);
const isFull = ()=> !!(document.fullscreenElement || document.webkitFullscreenElement) || document.body.classList.contains('pseudo');
function updateFs(){ const f=isFull(); fsBtn.textContent = f ? 'Exit full screen' : 'Full screen'; exitBtn.hidden = !document.body.classList.contains('pseudo'); size(); }
fsBtn.onclick=()=>{
  if(isFull()) return exitFull();
  if(canNative){ (root.requestFullscreen||root.webkitRequestFullscreen).call(root); }
  else { document.body.classList.add('pseudo'); updateFs(); }
};
